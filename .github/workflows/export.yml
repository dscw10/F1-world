name: Export a race

# Runs the Python pipeline on a GitHub runner, commits the exported data, and
# lets the deploy workflow publish it.
#
# WHY THIS EXISTS
#
# The pipeline needs to reach F1's timing archive, which means a machine with
# Python and open internet. This workflow is that machine. Everything happens
# on GitHub, so a race can be exported from any device that can open
# github.com — including an iPad, which cannot run Python at all.
#
# HOW TO RUN IT
#
#   Actions tab → "Export a race" → "Run workflow"
#   → fill in the year, Grand Prix and session → Run
#
# It takes roughly five to ten minutes, most of it downloading from the F1
# archive. When it finishes it commits to `main`, which triggers the deploy.

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Season, e.g. 2024'
        required: true
        default: '2024'
      gp:
        description: 'Grand Prix name or round number, e.g. Belgium'
        required: true
        default: 'Belgium'
      session:
        description: 'R (race), Q (qualifying), FP1, FP2, FP3, Sprint'
        required: true
        default: 'R'
      max_hz:
        description: 'Telemetry samples per second per car. 4 is plenty — the app interpolates.'
        required: false
        default: '4'

# Needed to commit the exported data back.
permissions:
  contents: write

concurrency:
  group: export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # A full-depth checkout so the commit lands cleanly on main.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install the pipeline
        run: pip install -r pipeline/requirements.txt

      # FastF1 caches the archive download. Keeping it between runs turns a
      # ten-minute export into a fast one when re-exporting the same race.
      - name: Restore the FastF1 cache
        uses: actions/cache@v4
        with:
          path: pipeline/cache
          key: fastf1-${{ inputs.year }}-${{ inputs.gp }}-${{ inputs.session }}
          restore-keys: fastf1-${{ inputs.year }}-

      - name: Export
        id: export
        working-directory: pipeline
        run: |
          set -o pipefail
          python export_session.py \
            --year "${{ inputs.year }}" \
            --gp "${{ inputs.gp }}" \
            --session "${{ inputs.session }}" \
            --max-hz "${{ inputs.max_hz }}" \
            --verify 2>&1 | tee export.log
        # The export exits 1 when a verification gate fails. That is a real
        # result, not a crash: it still writes the data and records the failure
        # in the manifest, and the app shows a warning. So the run is allowed to
        # continue and the outcome is reported below.
        continue-on-error: true

      - name: Report what happened
        run: |
          {
            echo "## Export: ${{ inputs.year }} ${{ inputs.gp }} ${{ inputs.session }}"
            echo
            if [ "${{ steps.export.outcome }}" = "success" ]; then
              echo "All verification gates passed."
            else
              echo "**At least one verification gate failed.** The data was still"
              echo "written and the app will say so on screen rather than"
              echo "presenting the figures as sound. The report is below."
            fi
            echo
            echo '```'
            tail -40 pipeline/export.log 2>/dev/null || echo "no log produced"
            echo '```'
            echo
            echo "### Files"
            echo '```'
            du -h public/data/*/*.json 2>/dev/null || echo "nothing written"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if nothing was written
        run: |
          if ! ls public/data/*/manifest.json >/dev/null 2>&1; then
            echo "::error::The export produced no data. See the summary above."
            exit 1
          fi

      - name: Commit the data
        run: |
          rm -f pipeline/export.log
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "Nothing changed — the export matched what is already committed."
            exit 0
          fi
          git commit -m "Export ${{ inputs.year }} ${{ inputs.gp }} ${{ inputs.session }}

          Generated by the 'Export a race' workflow. Verification: ${{ steps.export.outcome }}."
          git push origin HEAD:main
