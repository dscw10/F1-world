name: Build and deploy

# Builds the static site and publishes it to GitHub Pages.
#
# Runs on every push to the development branch, so the iteration cycle is:
# push → about two minutes → look at the URL.
#
# `workflow_dispatch` adds a "Run workflow" button in the Actions tab, for
# redeploying without pushing anything.

on:
  push:
    branches:
      - main
      - claude/repo-exploration-bsv9r8
  workflow_dispatch:

# Pages deployment needs these. `id-token` is how the deploy step proves to
# GitHub that it is this workflow, without a stored secret.
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes land close together, let the first finish rather than cancelling
# it — a half-deployed site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json specifies, rather than
      # re-resolving versions. A build that passes here then fails on a later
      # run because a dependency moved is a waste of everyone's afternoon.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # GitHub Pages serves this repo at /F1-world/. Without the prefix the
          # HTML loads and every asset 404s, which looks like broken CSS rather
          # than a path problem. See next.config.mjs.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      # Guards the two silent failure modes in docs/05. Both would otherwise
      # ship a page that loads with no styling and no error, which is the
      # class of bug this project keeps recording. Fail loudly here instead.
      - name: Verify build output
        run: |
          set -euo pipefail
          BASE="/${{ github.event.repository.name }}"

          test -f out/index.html || { echo "::error::out/index.html missing"; exit 1; }

          # Jekyll ignores directories starting with an underscore, and every
          # Next asset lives in /_next.
          test -f out/.nojekyll || {
            echo "::error::out/.nojekyll missing — GitHub Pages will drop /_next and serve an unstyled page"; exit 1; }

          # Assets must carry the sub-path prefix or every one of them 404s
          # while the HTML loads fine.
          grep -q "href=\"$BASE/_next/" out/index.html || {
            echo "::error::assets are not prefixed with $BASE — every stylesheet and script will 404"; exit 1; }

          # A stylesheet must actually have been emitted.
          grep -q 'rel="stylesheet"' out/index.html || {
            echo "::error::no stylesheet in out/index.html"; exit 1; }

          echo "Build output verified: index.html, .nojekyll, and assets prefixed with $BASE"

      # Pages must already be enabled for the repository, with Source set to
      # "GitHub Actions" (Settings → Pages). `enablement: true` was tried and
      # does NOT work here: the workflow token cannot create a Pages site
      # ("Create Pages site failed. Resource not accessible by integration"),
      # so this is a genuine one-time manual step. Do not re-add it.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
